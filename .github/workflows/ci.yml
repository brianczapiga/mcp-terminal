name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project and development tools
        run: python -m pip install '.[dev]'
      - name: Run required checks
        run: |
          ruff check .
          ruff format --check .
          mypy terminal_mcp tests
          pytest -m "not smoke"
          python -m build --no-isolation
      - name: Verify clean wheel install and entry point
        run: |
          python -m venv "$RUNNER_TEMP/wheel-check"
          "$RUNNER_TEMP/wheel-check/bin/python" -m pip install dist/*.whl
          test -x "$RUNNER_TEMP/wheel-check/bin/terminal-mcp-server"
          "$RUNNER_TEMP/wheel-check/bin/python" -c "import terminal_mcp.server"
