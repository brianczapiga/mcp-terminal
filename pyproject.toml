[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "terminal-mcp-server"
version = "2.0.0"
description = "A Python MCP (Model Context Protocol) server for macOS Terminal integration"
readme = "README.md"
license = "MIT"
authors = [
    {name = "Brian Czapiga", email = "brian@czapiga.com"}
]
maintainers = [
    {name = "Brian Czapiga", email = "brian@czapiga.com"}
]
keywords = ["mcp", "terminal", "macos", "ai", "automation", "applescript"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",

    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Systems Administration",
    "Topic :: Terminals",
]
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=3.4,<4",
    "pydantic>=2.8,<3",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = [
    "build>=1.2,<2",
    "mypy>=1.11,<2",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<2",
    "pytest-cov>=5,<7",
    "ruff>=0.12,<1",
]

[project.urls]
Homepage = "https://github.com/brianczapiga/mcp-terminal"
Repository = "https://github.com/brianczapiga/mcp-terminal"
Documentation = "https://github.com/brianczapiga/mcp-terminal#readme"
Issues = "https://github.com/brianczapiga/mcp-terminal/issues"
Changelog = "https://github.com/brianczapiga/mcp-terminal/blob/main/CHANGELOG.md"

[project.scripts]
terminal-mcp-server = "terminal_mcp.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["terminal_mcp*"]
exclude = ["tests*"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.mypy]
python_version = "3.10"
warn_return_any = false
warn_unused_configs = false
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false
disallow_untyped_decorators = false
no_implicit_optional = false
warn_redundant_casts = false
warn_unused_ignores = false
warn_no_return = false
warn_unreachable = false
strict_equality = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--tb=short",
]
markers = [
    "smoke: requires a real macOS terminal application and permissions",
]
